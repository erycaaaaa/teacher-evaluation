    source_loc: "src/components/LiveGeneratorModal.tsx:28"
    source: code
    default_value: "URL kosong"
    must_appear_in_target: true
    notes: "URL API non-secret dapat disimpan di localStorage."
  - key: "API Key"
    source_loc: "src/components/LiveGeneratorModal.tsx:48"
    source: code
    default_value: "kosong"
    must_appear_in_target: true
    notes: "Hanya state komponen; jangan persistensikan atau ekspor."
