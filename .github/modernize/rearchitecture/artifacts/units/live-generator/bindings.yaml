    name: "React modal"
    source_loc: "src/components/LiveGeneratorModal.tsx:44"
    target: "LiveGeneratorModal"
    must_appear_in_target: true
    notes: "Dibuka dari tombol generator di Admin."
  - type: route-declaration
    name: "GET /health"
    source_loc: "src/lib/api.ts:189"
    target: "checkHealth"
    must_appear_in_target: true
    notes: "Menentukan status koneksi dan tahap model yang tersedia."
  - type: route-declaration
    name: "POST /chat"
    source_loc: "src/lib/api.ts:204"
    target: "chat"
    must_appear_in_target: true
    notes: "Body mengikuti kontrak notebook dan dikirim serial."
runtime_config:
