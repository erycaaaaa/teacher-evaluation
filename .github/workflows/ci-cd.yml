name: CI/CD Pipeline - Question Bank Guru PJOK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ==========================================
  # STAGE 1: Quality Gate & Automated Testing
  # ==========================================
  test-and-lint:
    name: 🧪 Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: 🧪 Run Vitest Suite (Contract, Blind, Normalize)
        run: npm run test

  # ==========================================
  # STAGE 2: Production Build
  # ==========================================
  build:
    name: 🏗️ Production Build
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Static Bundle
        run: npm run build

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # ==========================================
  # STAGE 3: Continuous Deployment (GitHub Pages)
  # ==========================================
  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🌐 Deploy Static Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
